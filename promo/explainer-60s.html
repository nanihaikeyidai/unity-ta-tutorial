<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unity TA 实战学堂 · 2D Explainer</title>
<style>
  :root {
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --bg: #050816;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e2e8f0;
  }
  #stage-wrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #view {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: var(--bg);
    box-shadow: 0 0 60px rgba(34, 211, 238, 0.15);
    cursor: pointer;
  }
  #controls {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  #controls button {
    pointer-events: auto;
    border: 1px solid rgba(34,211,238,0.45);
    background: rgba(8,20,40,0.85);
    color: var(--cyan);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #controls button:hover { background: rgba(34,211,238,0.18); }
  #controls button.rec { border-color: #f472b6; color: #f472b6; }
  #status {
    position: fixed; left: 16px; top: 12px; z-index: 20;
    font-size: 12px; color: #64748b;
    background: rgba(0,0,0,0.45);
    padding: 4px 10px; border-radius: 6px;
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <canvas id="view" width="1280" height="720"></canvas>
</div>
<div id="status">加载中…</div>
<div id="controls">
  <button type="button" id="btn-play">播放</button>
  <button type="button" id="btn-record" class="rec">录制 WebM</button>
</div>
<audio id="narration" preload="auto" src="narration.mp3"></audio>
<script>
(() => {
  'use strict';

  const W = 1280, H = 720;
  const DURATION = 33.5; // IndexTTS ~30.07s + CTA hold
  const PARTICLE_N = 120;

  const view = document.getElementById('view');
  const ctx = view.getContext('2d', { alpha: false });
  const audio = document.getElementById('narration');
  const statusEl = document.getElementById('status');
  const btnPlay = document.getElementById('btn-play');
  const btnRecord = document.getElementById('btn-record');

  let cues = [];
  let playing = false;
  let t0 = 0;
  let pausedAt = 0;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recording = false;

  // --- Assets ---
  const sprites = {
    idle: null, wave: null, talk: null, point: null, nod: null, emphasize: null
  };

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('fail ' + src));
      img.src = src;
    });
  }

  async function loadSprites() {
    // Prefer keyed pose-*.png (silver); fallback front jpg
    const tryLoad = async (paths) => {
      for (const p of paths) {
        try { return await loadImage(p); } catch (_) {}
      }
      return null;
    };
    sprites.idle = await tryLoad([
      'assets/pose-idle.png', 'assets/silver-front.png', 'assets/ta-chibi-front.png', 'assets/ta-chibi-front.jpg'
    ]);
    sprites.wave = await tryLoad(['assets/pose-wave.png', 'assets/silver-wave.png', 'assets/pose-idle.png']);
    sprites.talk = await tryLoad(['assets/pose-talk.png', 'assets/silver-talk.png', 'assets/pose-idle.png']);
    sprites.point = await tryLoad(['assets/pose-point.png', 'assets/silver-point.png', 'assets/pose-idle.png']);
    sprites.nod = await tryLoad(['assets/pose-nod.png', 'assets/silver-nod.png', 'assets/pose-idle.png']);
    sprites.emphasize = sprites.talk || sprites.idle;
  }

  async function loadCues() {
    try {
      const res = await fetch('cues.json');
      cues = await res.json();
    } catch (_) {
      cues = [
        { t: 0, end: 2.5, text: '欢迎来到 Unity TA 实战学堂。', gesture: 'wave', scene: 'intro' },
        { t: 2.5, end: 7.4, text: '这里专为技术美术打造，用看得见的动画和中文语音，把渲染讲清楚。', gesture: 'talk', scene: 'intro' },
        { t: 7.4, end: 11.6, text: '学堂分三条主线：URP 管线，把一帧拆开看 Forward Plus 与 Renderer Feature；', gesture: 'point', scene: 'urp' },
        { t: 11.6, end: 15.7, text: '性能优化，用 Batcher 和 Overdraw 热力建立 Profiler 直觉；', gesture: 'emphasize', scene: 'perf' },
        { t: 15.7, end: 19.8, text: '还有 Shader 技术，Fresnel、Dissolve，公式直接画成光影。', gesture: 'talk', scene: 'shader' },
        { t: 19.8, end: 22.7, text: '每课都有程序动画演示，点讲解就能听。', gesture: 'nod', scene: 'shader' },
        { t: 22.7, end: 27.0, text: '建议从 URP 第一章起步，建好心智模型，再钻性能和着色器。', gesture: 'point', scene: 'cta' },
        { t: 27.0, end: 30.1, text: '打开站点，开始你的 TA 进阶之路。', gesture: 'wave', scene: 'cta' },
        { t: 30.1, end: 33.5, text: 'Unity TA 实战学堂 · 开始学习', gesture: 'idle', scene: 'cta' }
      ];
    }
  }

  // --- Particles (2D dots/lines, <200) ---
  const particles = Array.from({ length: PARTICLE_N }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    r: 0.6 + Math.random() * 1.6,
    a: 0.15 + Math.random() * 0.45
  }));

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
    }
  }

  function drawParticles(c) {
    c.save();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      c.fillStyle = `rgba(34,211,238,${p.a})`;
      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c.fill();
      // sparse links
      if (i % 7 === 0) {
        const q = particles[(i + 11) % particles.length];
        const dx = p.x - q.x, dy = p.y - q.y;
        if (dx * dx + dy * dy < 140 * 140) {
          c.strokeStyle = 'rgba(167,139,250,0.12)';
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(p.x, p.y);
          c.lineTo(q.x, q.y);
          c.stroke();
        }
      }
    }
    c.restore();
  }

  // --- Helpers ---
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function glassCard(c, x, y, w, h, glow) {
    c.save();
    roundRect(c, x, y, w, h, 14);
    c.fillStyle = 'rgba(8, 20, 40, 0.72)';
    c.fill();
    c.strokeStyle = glow || 'rgba(34,211,238,0.45)';
    c.lineWidth = 1.5;
    c.stroke();
    c.restore();
  }

  function cueAt(t) {
    let cur = cues[0] || null;
    for (const cu of cues) {
      if (t >= cu.t) cur = cu;
    }
    return cur;
  }

  function nowTime() {
    if (!playing) return pausedAt;
    if (audio && !audio.paused && isFinite(audio.currentTime)) {
      return Math.min(DURATION, audio.currentTime);
    }
    return Math.min(DURATION, (performance.now() - t0) / 1000);
  }

  // --- Scenes ---
  function drawBg(c, t) {
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#050816');
    g.addColorStop(0.5, '#0a1028');
    g.addColorStop(1, '#12081f');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    // soft vignette grid
    c.strokeStyle = 'rgba(34,211,238,0.04)';
    c.lineWidth = 1;
    for (let x = 0; x < W; x += 64) {
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    }
    for (let y = 0; y < H; y += 64) {
      c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    }
    // drifting glow orbs
    c.save();
    c.globalCompositeOperation = 'lighter';
    const ox = 200 + Math.sin(t * 0.4) * 80;
    const oy = 180 + Math.cos(t * 0.3) * 60;
    const rg = c.createRadialGradient(ox, oy, 10, ox, oy, 220);
    rg.addColorStop(0, 'rgba(34,211,238,0.18)');
    rg.addColorStop(1, 'rgba(34,211,238,0)');
    c.fillStyle = rg;
    c.fillRect(0, 0, W, H);
    const ox2 = W - 260 + Math.cos(t * 0.35) * 70;
    const oy2 = H - 200 + Math.sin(t * 0.45) * 50;
    const rg2 = c.createRadialGradient(ox2, oy2, 10, ox2, oy2, 240);
    rg2.addColorStop(0, 'rgba(167,139,250,0.16)');
    rg2.addColorStop(1, 'rgba(167,139,250,0)');
    c.fillStyle = rg2;
    c.fillRect(0, 0, W, H);
    c.restore();
  }

  function drawIntro(c, t, local) {
    const fade = Math.min(1, local / 0.6);
    c.save();
    c.globalAlpha = fade;
    // badge
    glassCard(c, W / 2 - 110, 160, 220, 36, 'rgba(34,211,238,0.55)');
    c.fillStyle = '#22d3ee';
    c.font = '600 13px system-ui, sans-serif';
    c.textAlign = 'center';
    c.fillText('TECH ARTIST ACADEMY', W / 2, 183);

    // kinetic title
    const scale = 1 + Math.sin(t * 2) * 0.01;
    c.translate(W / 2, 280);
    c.scale(scale, scale);
    const grad = c.createLinearGradient(-280, 0, 280, 0);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.45, '#22d3ee');
    grad.addColorStop(1, '#a78bfa');
    c.fillStyle = grad;
    c.font = '800 54px system-ui, "PingFang SC", sans-serif';
    c.textAlign = 'center';
    c.shadowColor = 'rgba(34,211,238,0.45)';
    c.shadowBlur = 24;
    c.fillText('Unity TA 实战学堂', 0, 0);
    c.shadowBlur = 0;
    c.setTransform(1, 0, 0, 1, 0, 0);

    c.fillStyle = '#94a3b8';
    c.font = '400 18px system-ui, "PingFang SC", sans-serif';
    c.textAlign = 'center';
    c.fillText('看得见的渲染 · 中文语音讲解 · 程序动画演示', W / 2, 340);

    // trio pillars preview
    const pillars = [
      { label: 'URP 管线', x: W / 2 - 280 },
      { label: '性能优化', x: W / 2 - 70 },
      { label: 'Shader 技术', x: W / 2 + 140 }
    ];
    pillars.forEach((p, i) => {
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + i);
      glassCard(c, p.x, 400, 140, 52, `rgba(34,211,238,${0.25 + pulse * 0.35})`);
      c.fillStyle = '#e2e8f0';
      c.font = '600 15px system-ui, "PingFang SC", sans-serif';
      c.textAlign = 'center';
      c.fillText(p.label, p.x + 70, 432);
    });
    c.restore();
  }

  function drawURP(c, t, local) {
    const nodes = [
      { id: 'Camera', x: 220, y: 200 },
      { id: 'Culling', x: 420, y: 200 },
      { id: 'Forward+', x: 620, y: 200 },
      { id: 'Opaque', x: 420, y: 340 },
      { id: 'Sky / Fog', x: 620, y: 340 },
      { id: 'Feature', x: 820, y: 270 },
      { id: 'Post', x: 1000, y: 270 }
    ];
    const edges = [[0,1],[1,2],[2,3],[2,4],[3,5],[4,5],[5,6]];
    const lit = Math.min(nodes.length, Math.floor(local * 1.4) + 1);

    c.save();
    c.fillStyle = '#22d3ee';
    c.font = '700 22px system-ui, "PingFang SC", sans-serif';
    c.textAlign = 'left';
    c.fillText('URP · 一帧管线', 80, 110);
    c.fillStyle = '#94a3b8';
    c.font = '400 14px system-ui, sans-serif';
    c.fillText('Forward Plus · Renderer Feature', 80, 136);

    // edges
    edges.forEach(([a, b], i) => {
      const na = nodes[a], nb = nodes[b];
      const on = lit > Math.max(a, b);
      c.strokeStyle = on ? 'rgba(34,211,238,0.75)' : 'rgba(100,116,139,0.35)';
      c.lineWidth = on ? 2.5 : 1.5;
      c.beginPath();
      c.moveTo(na.x, na.y);
      c.lineTo(nb.x, nb.y);
      c.stroke();
      if (on) {
        const u = (Math.sin(t * 4 + i) * 0.5 + 0.5);
        const px = na.x + (nb.x - na.x) * u;
        const py = na.y + (nb.y - na.y) * u;
        c.fillStyle = '#22d3ee';
        c.beginPath();
        c.arc(px, py, 3.5, 0, Math.PI * 2);
        c.fill();
      }
    });

    nodes.forEach((n, i) => {
      const on = i < lit;
      const pulse = on ? 1 + 0.04 * Math.sin(t * 5 + i) : 1;
      c.save();
      c.translate(n.x, n.y);
      c.scale(pulse, pulse);
      glassCard(c, -70, -28, 140, 56, on ? 'rgba(34,211,238,0.8)' : 'rgba(100,116,139,0.4)');
      if (on) {
        c.shadowColor = 'rgba(34,211,238,0.55)';
        c.shadowBlur = 16;
      }
      c.fillStyle = on ? '#e2e8f0' : '#64748b';
      c.font = '600 15px system-ui, sans-serif';
      c.textAlign = 'center';
      c.fillText(n.id, 0, 6);
      c.restore();
    });
    c.restore();
  }

  function drawPerf(c, t, local) {
    c.save();
    c.fillStyle = '#f472b6';
    c.font = '700 22px system-ui, "PingFang SC", sans-serif';
    c.fillText('性能 · Overdraw / Batcher', 80, 110);
    c.fillStyle = '#94a3b8';
    c.font = '400 14px system-ui, sans-serif';
    c.fillText('用热力建立 Profiler 直觉', 80, 136);

    // overlapping translucent quads (overdraw)
    const quads = [
      { x: 180, y: 200, w: 280, h: 200, col: 'rgba(244,114,182,0.28)' },
      { x: 280, y: 240, w: 260, h: 190, col: 'rgba(251,146,60,0.30)' },
      { x: 360, y: 210, w: 240, h: 210, col: 'rgba(239,68,68,0.32)' },
      { x: 240, y: 280, w: 220, h: 160, col: 'rgba(248,113,113,0.25)' }
    ];
    const show = Math.min(quads.length, 1 + Math.floor(local * 1.2));
    for (let i = 0; i < show; i++) {
      const q = quads[i];
      const jx = Math.sin(t * 1.5 + i) * 4;
      roundRect(c, q.x + jx, q.y, q.w, q.h, 10);
      c.fillStyle = q.col;
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.15)';
      c.stroke();
    }
    c.fillStyle = '#fda4af';
    c.font = '600 13px system-ui, sans-serif';
    c.fillText('Overdraw ×' + show, 200, 480);

    // profiler bars
    const bars = [0.45, 0.72, 0.38, 0.9, 0.55, 0.66, 0.48];
    const labels = ['CPU', 'GPU', 'Draw', 'Tris', 'Batch', 'SetPass', 'GC'];
    bars.forEach((v, i) => {
      const target = v * Math.min(1, local / 1.5 + 0.2);
      const h = 180 * target * (0.92 + 0.08 * Math.sin(t * 3 + i));
      const x = 720 + i * 58;
      const y = 460 - h;
      glassCard(c, x, 260, 48, 220, 'rgba(167,139,250,0.35)');
      const g = c.createLinearGradient(0, 460, 0, 280);
      g.addColorStop(0, '#22d3ee');
      g.addColorStop(1, '#a78bfa');
      c.fillStyle = g;
      roundRect(c, x + 8, y, 32, h, 6);
      c.fill();
      c.fillStyle = '#94a3b8';
      c.font = '11px system-ui, sans-serif';
      c.textAlign = 'center';
      c.fillText(labels[i], x + 24, 500);
    });
    c.restore();
  }

  function drawShader(c, t, local) {
    c.save();
    c.fillStyle = '#a78bfa';
    c.font = '700 22px system-ui, "PingFang SC", sans-serif';
    c.fillText('Shader · Fresnel / Dissolve', 80, 110);
    c.fillStyle = '#94a3b8';
    c.font = '400 14px system-ui, sans-serif';
    c.fillText('公式直接画成光影', 80, 136);

    // Fresnel ring (left)
    const cx = 360, cy = 360, R = 110;
    const fresnel = 0.35 + 0.65 * Math.min(1, local / 2);
    c.save();
    c.translate(cx, cy);
    c.rotate(t * 0.4);
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(0, 0, R - i * 8, 0, Math.PI * 2);
      c.strokeStyle = `rgba(34,211,238,${(0.55 - i * 0.12) * fresnel})`;
      c.lineWidth = 10 - i * 2;
      c.stroke();
    }
    // inner fill
    const rg = c.createRadialGradient(0, 0, 20, 0, 0, R);
    rg.addColorStop(0, 'rgba(15,23,42,0.9)');
    rg.addColorStop(0.7, 'rgba(30,41,59,0.6)');
    rg.addColorStop(1, `rgba(34,211,238,${0.45 * fresnel})`);
    c.beginPath();
    c.arc(0, 0, R - 4, 0, Math.PI * 2);
    c.fillStyle = rg;
    c.fill();
    c.restore();
    c.fillStyle = '#22d3ee';
    c.font = '600 16px system-ui, sans-serif';
    c.textAlign = 'center';
    c.fillText('Fresnel', cx, cy + R + 36);

    // Dissolve wipe (right)
    const dx = 860, dy = 360, dR = 120;
    const dissolve = Math.min(1, Math.max(0, (local - 1.2) / 3));
    c.save();
    // clip with noisy threshold via pixel blocks
    c.beginPath();
    c.arc(dx, dy, dR, 0, Math.PI * 2);
    c.clip();
    const g2 = c.createLinearGradient(dx - dR, dy, dx + dR, dy);
    g2.addColorStop(0, '#7c3aed');
    g2.addColorStop(1, '#22d3ee');
    c.fillStyle = g2;
    c.fillRect(dx - dR, dy - dR, dR * 2, dR * 2);

    // dissolve holes
    const seed = Math.floor(t * 8);
    for (let i = 0; i < 80; i++) {
      const ang = (i * 47 + seed) % 360;
      const rad = ((i * 73) % 100) / 100 * dR;
      const px = dx + Math.cos(ang) * rad;
      const py = dy + Math.sin(ang) * rad;
      const thr = (i % 10) / 10;
      if (thr < dissolve) {
        c.globalCompositeOperation = 'destination-out';
        c.beginPath();
        c.arc(px, py, 6 + (i % 5), 0, Math.PI * 2);
        c.fill();
        c.globalCompositeOperation = 'source-over';
      }
    }
    // edge glow ring at dissolve front
    c.strokeStyle = `rgba(244,114,182,${0.3 + dissolve * 0.5})`;
    c.lineWidth = 4;
    c.beginPath();
    c.arc(dx, dy, dR * (1 - dissolve * 0.85), 0, Math.PI * 2);
    c.stroke();
    c.restore();

    c.fillStyle = '#a78bfa';
    c.font = '600 16px system-ui, sans-serif';
    c.textAlign = 'center';
    c.fillText('Dissolve', dx, dy + dR + 36);
    c.restore();
  }

  function drawCTA(c, t, local) {
    c.save();
    c.fillStyle = '#e2e8f0';
    c.font = '700 22px system-ui, "PingFang SC", sans-serif';
    c.textAlign = 'left';
    c.fillText('学习路径', 80, 120);

    const steps = [
      { label: 'URP 第一章', sub: '建心智模型', color: '#22d3ee' },
      { label: '性能优化', sub: 'Profiler 直觉', color: '#f472b6' },
      { label: 'Shader 技术', sub: '公式成光影', color: '#a78bfa' }
    ];
    const progress = Math.min(1, local / 2.5);
    steps.forEach((s, i) => {
      const x = 160 + i * 280;
      const y = 280;
      const on = progress > i / 3;
      glassCard(c, x, y, 220, 120, on ? s.color : 'rgba(100,116,139,0.35)');
      c.fillStyle = on ? s.color : '#64748b';
      c.font = '700 20px system-ui, "PingFang SC", sans-serif';
      c.textAlign = 'center';
      c.fillText(s.label, x + 110, y + 52);
      c.fillStyle = '#94a3b8';
      c.font = '400 14px system-ui, "PingFang SC", sans-serif';
      c.fillText(s.sub, x + 110, y + 82);
      if (i < steps.length - 1) {
        c.strokeStyle = on ? s.color : 'rgba(100,116,139,0.4)';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x + 220, y + 60);
        c.lineTo(x + 280, y + 60);
        c.stroke();
        // arrow tip
        c.beginPath();
        c.moveTo(x + 280, y + 60);
        c.lineTo(x + 268, y + 52);
        c.lineTo(x + 268, y + 68);
        c.closePath();
        c.fillStyle = c.strokeStyle;
        c.fill();
      }
    });

    // CTA button
    const pulse = 1 + 0.03 * Math.sin(t * 4);
    c.save();
    c.translate(W / 2, 500);
    c.scale(pulse, pulse);
    roundRect(c, -160, -28, 320, 56, 28);
    const bg = c.createLinearGradient(-160, 0, 160, 0);
    bg.addColorStop(0, '#0891b2');
    bg.addColorStop(1, '#7c3aed');
    c.fillStyle = bg;
    c.fill();
    c.shadowColor = 'rgba(34,211,238,0.5)';
    c.shadowBlur = 20;
    c.fillStyle = '#fff';
    c.font = '700 20px system-ui, "PingFang SC", sans-serif';
    c.textAlign = 'center';
    c.fillText('打开站点 · 开始学习', 0, 8);
    c.restore();
    c.restore();
  }

  function drawScene(c, scene, t, cue) {
    const local = Math.max(0, t - (cue ? cue.t : 0));
    switch (scene) {
      case 'intro': drawIntro(c, t, local); break;
      case 'urp': drawURP(c, t, local); break;
      case 'perf': drawPerf(c, t, local); break;
      case 'shader': drawShader(c, t, local); break;
      case 'cta': drawCTA(c, t, local); break;
      default: drawIntro(c, t, local);
    }
  }

  function drawSceneLabel(c, scene) {
    const map = {
      intro: 'INTRO',
      urp: 'URP PIPELINE',
      perf: 'PERFORMANCE',
      shader: 'SHADER',
      cta: 'START LEARNING'
    };
    glassCard(c, 36, 28, 200, 34, 'rgba(34,211,238,0.4)');
    c.fillStyle = '#22d3ee';
    c.font = '600 12px system-ui, sans-serif';
    c.textAlign = 'left';
    c.fillText(map[scene] || scene.toUpperCase(), 52, 50);
  }

  function drawChibi(c, t, gesture) {
    const key = (gesture === 'emphasize') ? 'emphasize' : gesture;
    const img = sprites[key] || sprites.idle;
    if (!img) return;

    // bottom-left placement
    const targetH = 300;
    const scale = targetH / img.height;
    const dw = img.width * scale;
    const dh = targetH;
    const baseX = 36;
    const baseY = H - dh - 70;

    // puppet motion by gesture
    let bob = Math.sin(t * 2.4) * 4;
    let rot = Math.sin(t * 1.6) * 0.02;
    let sx = 1, sy = 1;
    let lean = 0;

    switch (gesture) {
      case 'wave':
        bob = Math.sin(t * 5) * 5;
        rot = Math.sin(t * 6) * 0.05;
        sx = 1 + Math.sin(t * 6) * 0.02;
        break;
      case 'talk':
        bob = Math.sin(t * 3.2) * 3;
        sy = 1 + Math.sin(t * 8) * 0.015;
        break;
      case 'point':
        lean = 0.06;
        bob = Math.sin(t * 2) * 2;
        break;
      case 'nod':
        rot = Math.sin(t * 5) * 0.08;
        bob = Math.abs(Math.sin(t * 5)) * -6;
        break;
      case 'emphasize':
        sx = 1 + Math.sin(t * 7) * 0.04;
        sy = 1 - Math.sin(t * 7) * 0.02;
        break;
      default:
        break;
    }

    // soft vignette circle behind
    c.save();
    const vx = baseX + dw * 0.45;
    const vy = baseY + dh * 0.55;
    const vg = c.createRadialGradient(vx, vy, 20, vx, vy, dw * 0.55);
    vg.addColorStop(0, 'rgba(34,211,238,0.18)');
    vg.addColorStop(0.6, 'rgba(167,139,250,0.08)');
    vg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = vg;
    c.beginPath();
    c.arc(vx, vy, dw * 0.55, 0, Math.PI * 2);
    c.fill();
    c.restore();

    c.save();
    c.translate(baseX + dw / 2, baseY + dh + bob);
    c.rotate(rot + lean);
    c.scale(sx, sy);
    c.drawImage(img, -dw / 2, -dh, dw, dh);
    c.restore();
  }

  function drawSubs(c, text) {
    if (!text) return;
    c.save();
    c.font = '600 22px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
    const metrics = c.measureText(text);
    const tw = Math.min(W - 280, metrics.width + 48);
    const th = 48;
    const x = (W - tw) / 2;
    const y = H - 58;
    roundRect(c, x, y, tw, th, 10);
    c.fillStyle = 'rgba(2, 6, 23, 0.72)';
    c.fill();
    c.strokeStyle = 'rgba(34,211,238,0.35)';
    c.lineWidth = 1;
    c.stroke();
    c.fillStyle = '#f8fafc';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(text, W / 2, y + th / 2 + 1, tw - 24);
    c.restore();
  }

  function drawFrame(t) {
    const cue = cueAt(t);
    const scene = (cue && cue.scene) || 'intro';
    const gesture = (cue && cue.gesture) || 'idle';
    const text = (cue && cue.text) || '';

    drawBg(ctx, t);
    updateParticles(1 / 30);
    drawParticles(ctx);
    drawScene(ctx, scene, t, cue);
    drawSceneLabel(ctx, scene);
    drawChibi(ctx, t, gesture);
    drawSubs(ctx, text);

    // timecode
    ctx.fillStyle = 'rgba(148,163,184,0.55)';
    ctx.font = '11px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(t.toFixed(1) + 's / ' + DURATION.toFixed(1) + 's', W - 24, 28);
  }

  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    let t = nowTime();
    if (playing && t >= DURATION) {
      playing = false;
      pausedAt = DURATION;
      if (audio) { try { audio.pause(); } catch (_) {} }
      btnPlay.textContent = '重播';
      if (recording) stopRecording();
    }
    drawFrame(t);
    statusEl.textContent = playing
      ? `播放中 ${t.toFixed(1)}s · ${cueAt(t)?.scene || ''}`
      : (t > 0 ? `暂停 ${t.toFixed(1)}s` : '就绪 · 纯 2D Canvas');
    requestAnimationFrame(loop);
  }

  function play() {
    if (playing) {
      playing = false;
      pausedAt = nowTime();
      if (audio) audio.pause();
      btnPlay.textContent = '继续';
      return;
    }
    if (pausedAt >= DURATION - 0.05) pausedAt = 0;
    playing = true;
    t0 = performance.now() - pausedAt * 1000;
    if (audio) {
      audio.currentTime = pausedAt;
      audio.play().catch(() => {});
    }
    btnPlay.textContent = '暂停';
  }

  function startRecording() {
    if (recording) return;
    recordedChunks = [];
    const stream = view.captureStream(30);
    // mix audio if possible
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx && audio) {
        const actx = new AudioCtx();
        const src = actx.createMediaElementSource(audio);
        const dest = actx.createMediaStreamDestination();
        src.connect(dest);
        src.connect(actx.destination);
        dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));
      }
    } catch (_) {}

    let mime = 'video/webm;codecs=vp9,opus';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
    if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'unity-ta-explainer-2d.webm';
      a.click();
      statusEl.textContent = '录制完成 · 已下载 WebM';
    };
    mediaRecorder.start(200);
    recording = true;
    btnRecord.textContent = '停止录制';
    pausedAt = 0;
    if (!playing) play();
  }

  function stopRecording() {
    if (!recording || !mediaRecorder) return;
    recording = false;
    try { mediaRecorder.stop(); } catch (_) {}
    btnRecord.textContent = '录制 WebM';
  }

  btnPlay.addEventListener('click', (e) => { e.stopPropagation(); play(); });
  btnRecord.addEventListener('click', (e) => {
    e.stopPropagation();
    if (recording) stopRecording();
    else startRecording();
  });
  view.addEventListener('click', () => play());

  // boot
  (async () => {
    await Promise.all([loadSprites(), loadCues()]);
    statusEl.textContent = '就绪 · 纯 2D Canvas · 银白发讲解员';
    drawFrame(0);
    requestAnimationFrame(loop);

    const params = new URLSearchParams(location.search);
    if (params.get('autoplay') === '1') {
      setTimeout(() => play(), 300);
    }
    if (params.get('record') === '1') {
      setTimeout(() => startRecording(), 500);
    }
  })().catch((err) => {
    statusEl.textContent = '加载失败: ' + err.message;
    console.error(err);
  });
})();
</script>
</body>
</html>
